# @package neural
datamodule:
  _target_: hand_gesture_recognition.pipeline.models.neural.datamodule.EMGDataModule
  batch_size: 32
  num_workers: 0
  shuffle: false
model:
  _target_: hand_gesture_recognition.pipeline.models.neural.lstm.LSTMModule
  hidden_size: 64
  num_layers: 4
optimizer:
  _target_: torch.optim.Adam   # or torch.optim.SGD / AdamW / RMSprop
  lr: 0.001
  weight_decay: 0.0

# Optional early stopping. Enable by replacing `null` with, e.g.:
#   _target_: lightning.pytorch.callbacks.EarlyStopping
#   monitor: val_loss
#   patience: 5
#   mode: min
early_stopping:
   _target_: lightning.pytorch.callbacks.EarlyStopping
   monitor: val_loss
   patience: 5
   mode: min
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 100
  accelerator: auto
  enable_progress_bar: true
  enable_model_summary: true
  enable_checkpointing: false
  logger: true
