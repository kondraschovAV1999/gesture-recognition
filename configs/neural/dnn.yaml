# @package neural
datamodule:
  _target_: hand_gesture_recognition.neural.datamodules.emg.EMGDataModule
  batch_size: 32
  num_workers: 0
model:
  _target_: hand_gesture_recognition.neural.models.dnn.DNNModule
  hidden_dims: [128, 64]
optimizer:
  _target_: torch.optim.Adam   # or torch.optim.SGD / AdamW / RMSprop
  lr: 0.001
  weight_decay: 0.0
# Optional early stopping. Enable by replacing `null` with, e.g.:
#   _target_: lightning.pytorch.callbacks.EarlyStopping
#   monitor: val_loss
#   patience: 5
#   mode: min
early_stopping: null
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 5
  accelerator: cpu
  enable_progress_bar: false
  enable_model_summary: false
  enable_checkpointing: false
  logger: false
