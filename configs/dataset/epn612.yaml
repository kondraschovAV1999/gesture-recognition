# @package dataset
name: epn612
path: resources/data/EPN612
sampling_rate: 200
include_no_gesture: no   # false => 5-class (rest removed); pair with gesture_crop=none
loader:
  _target_: hand_gesture_recognition.pipeline.data_loaders.epn612.EPN612Loader
  subjects: null  # e.g. override with: dataset.loader.subjects=[train:user1,train:user2]
  max_train_users: 25
  max_test_users: 25
  user_seed: 42
