defaults:
  - dataset: epn612
  - windowing: two_level
  - signal_processing: emg
  - gesture_crop: none
  - baseline: per_user
  - classical: random_forest
  - feature_extraction: default
  - neural: cnn_lstm
  - evaluation: basic
  - analytics: basic
  - cv: none
  - visualization: default
  - _self_

# experiment (inlined from configs/experiment/default.yaml)
backend: neural
seed: 42
deterministic: true
tracking:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: hand_gesture_recognition
reporting:
  formats: [json, html]

# task (inlined from configs/task/*.yaml)
task:
  name: recognition

# split (inlined from configs/split/subject_wise.yaml)
split:
  strategy: trial_wise
  split_on: trial_ids
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  seed: 42

hydra:
  run:
    dir: output/test_runs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: output/test_runs
  job:
    chdir: false
